<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMap MVP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toolbar">
        <button id="add-child">Add Child Node</button>
        <button id="edit-node">Edit Node</button>
        <button id="delete-node">Delete Node</button>
        <button id="save-map">Save Map</button>
    </div>
    <div class="canvas-container">
        <svg id="connections" width="100%" height="100%"></svg>
        <div id="mindmap" class="mindmap"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
